repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^web/package-lock\.json$
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: web-format
        name: format web
        entry: npm --prefix web run format
        language: system
        pass_filenames: false
        files: ^web/
      - id: web-lint
        name: lint web
        entry: npm --prefix web run lint
        language: system
        pass_filenames: false
        files: ^web/
      - id: web-build
        name: build web
        entry: npm --prefix web run build
        language: system
        pass_filenames: false
        files: ^web/
      - id: go-fmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: task vet
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: task lint
        language: system
        types: [go]
        pass_filenames: false
